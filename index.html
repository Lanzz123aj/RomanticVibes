<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu 💗</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
  }

  #app {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #0a0a2e 0%, #0d1b4b 25%, #1a1040 50%, #0f0a30 75%, #06061a 100%);
  }

  #stars-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  .nebula-1 { width: 500px; height: 350px; background: rgba(120, 80, 200, 0.18); top: 5%; left: -5%; }
  .nebula-2 { width: 400px; height: 400px; background: rgba(60, 100, 220, 0.15); top: 30%; right: -5%; }
  .nebula-3 { width: 350px; height: 250px; background: rgba(200, 80, 140, 0.12); bottom: 10%; left: 30%; }

  /* LANDING */
  #landing {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .landing-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(24px, 4vw, 38px);
    color: rgba(255, 255, 255, 0.75);
    letter-spacing: 3px;
    margin-bottom: 10px;
    animation: fadeInDown 1.2s ease forwards;
    opacity: 0;
  }

  .landing-subtitle {
    font-size: clamp(11px, 1.5vw, 14px);
    color: rgba(180, 160, 230, 0.6);
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 60px;
    animation: fadeInDown 1.2s 0.3s ease forwards;
    opacity: 0;
  }

  .click-btn {
    width: clamp(110px, 15vw, 150px);
    height: clamp(110px, 15vw, 150px);
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(180, 100, 200, 0.3), rgba(100, 120, 255, 0.3));
    border: 1.5px solid rgba(200, 160, 255, 0.5);
    color: white;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: all 0.3s ease;
    animation: fadeInUp 1.2s 0.6s ease forwards, btnPulse 3s 2s ease-in-out infinite;
    opacity: 0;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 40px rgba(160, 100, 255, 0.25), inset 0 0 30px rgba(255,255,255,0.05);
  }

  .click-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 80px rgba(180, 120, 255, 0.5), inset 0 0 30px rgba(255,255,255,0.08);
    border-color: rgba(220, 180, 255, 0.9);
  }

  .click-btn .emoji { font-size: clamp(30px, 4vw, 44px); }

  .click-btn span.btn-label {
    font-family: 'Quicksand', sans-serif;
    font-size: clamp(10px, 1.2vw, 13px);
    font-weight: 600;
    letter-spacing: 3px;
    color: rgba(220, 200, 255, 0.8);
    margin-top: 6px;
    text-transform: uppercase;
  }

  .btn-ring {
    position: absolute;
    width: calc(100% + 24px); height: calc(100% + 24px);
    border-radius: 50%;
    border: 1px solid rgba(200, 160, 255, 0.15);
    animation: ringPulse 3s 2s ease-in-out infinite;
  }
  .btn-ring-2 {
    width: calc(100% + 50px); height: calc(100% + 50px);
    animation-delay: 2.4s;
    border-color: rgba(200, 160, 255, 0.08);
  }

  /* MAIN PAGE */
  #main-page {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    opacity: 0;
    transform: translateY(30px);
    pointer-events: none;
    transition: opacity 0.9s ease, transform 0.9s ease;
    overflow-y: auto;
  }

  #main-page.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }

  .bear-wrap {
    position: relative;
    margin-bottom: clamp(16px, 2.5vh, 28px);
    animation: float 4s ease-in-out infinite;
    flex-shrink: 0;
  }

  .bear-svg {
    width: clamp(100px, 14vw, 150px);
    height: clamp(100px, 14vw, 150px);
    filter: drop-shadow(0 10px 40px rgba(200, 140, 100, 0.45));
  }

  .heart-float {
    position: absolute;
    animation: heartFloat 2.5s ease-in-out infinite;
    opacity: 0;
  }
  .h1 { font-size: clamp(13px, 1.8vw, 18px); top: 5px; right: -8px; animation-delay: 0s; }
  .h2 { font-size: clamp(10px, 1.3vw, 13px); top: 22px; left: -12px; animation-delay: 0.8s; }
  .h3 { font-size: clamp(11px, 1.5vw, 15px); top: -6px; right: 22px; animation-delay: 1.5s; }

  .msg-card {
    width: min(90%, 560px);
    background: rgba(255, 255, 255, 0.05);
    border: 0.5px solid rgba(200, 160, 255, 0.22);
    border-radius: clamp(16px, 2.5vw, 28px);
    padding: clamp(22px, 3vw, 36px) clamp(22px, 3.5vw, 40px) clamp(18px, 2.5vw, 28px);
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 60px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .from-label {
    font-size: clamp(10px, 1.2vw, 13px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(180, 150, 255, 0.6);
    margin-bottom: clamp(12px, 2vh, 18px);
    font-weight: 600;
  }

  .typewriter-text {
    font-size: clamp(13px, 1.6vw, 16.5px);
    line-height: 2;
    color: rgba(240, 230, 255, 0.92);
    font-weight: 400;
    min-height: 120px;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: rgba(200, 160, 255, 0.85);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
    border-radius: 1px;
  }

  .bottom-tag {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(12px, 1.4vw, 15px);
    color: rgba(200, 170, 255, 0.5);
    letter-spacing: 1px;
    margin-top: clamp(12px, 1.8vh, 18px);
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  .deco-note {
    position: absolute;
    font-size: clamp(12px, 1.5vw, 18px);
    color: rgba(200, 160, 255, 0.2);
    animation: floatNote 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(160, 100, 255, 0.25), inset 0 0 30px rgba(255,255,255,0.05); }
    50% { box-shadow: 0 0 80px rgba(180, 120, 255, 0.5), inset 0 0 30px rgba(255,255,255,0.08); }
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }
  @keyframes heartFloat {
    0% { opacity: 0; transform: translateY(0) scale(0.8); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; } 50% { opacity: 0; }
  }
  @keyframes floatNote {
    0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.2; }
    50% { transform: translateY(-18px) rotate(5deg); opacity: 0.45; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>
  <canvas id="stars-canvas"></canvas>

  <div class="deco-note" style="top:8%;left:6%;animation-delay:0s;">♪</div>
  <div class="deco-note" style="top:15%;right:7%;animation-delay:2s;">♫</div>
  <div class="deco-note" style="bottom:12%;left:8%;animation-delay:4s;">♩</div>
  <div class="deco-note" style="bottom:20%;right:10%;animation-delay:1.5s;">♪</div>

  <!-- LANDING -->
  <div id="landing">
    <div class="landing-title">untuk kamu, sayang ✦</div>
    <div class="landing-subtitle">sebuah pesan dari hati</div>
    <div style="position:relative;display:flex;align-items:center;justify-content:center;">
      <div class="btn-ring"></div>
      <div class="btn-ring btn-ring-2"></div>
      <button class="click-btn" onclick="enterMain()">
        <span class="emoji">💗</span>
        <span class="btn-label">Klik</span>
      </button>
    </div>
  </div>

  <!-- MAIN PAGE -->
  <div id="main-page">
    <div class="bear-wrap">
      <span class="heart-float h1">💕</span>
      <span class="heart-float h2">💗</span>
      <span class="heart-float h3">✨</span>
      <svg class="bear-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="30" r="16" fill="#c8865a"/>
        <circle cx="88" cy="30" r="16" fill="#c8865a"/>
        <circle cx="32" cy="30" r="9" fill="#f2c4a0"/>
        <circle cx="88" cy="30" r="9" fill="#f2c4a0"/>
        <ellipse cx="60" cy="58" rx="36" ry="34" fill="#c8865a"/>
        <ellipse cx="60" cy="68" rx="18" ry="14" fill="#f5dfc9"/>
        <circle cx="48" cy="52" r="5.5" fill="#2a1a0e"/>
        <circle cx="72" cy="52" r="5.5" fill="#2a1a0e"/>
        <circle cx="49.5" cy="50.5" r="2" fill="white"/>
        <circle cx="73.5" cy="50.5" r="2" fill="white"/>
        <ellipse cx="38" cy="63" rx="7" ry="4" fill="rgba(230,110,110,0.35)"/>
        <ellipse cx="82" cy="63" rx="7" ry="4" fill="rgba(230,110,110,0.35)"/>
        <ellipse cx="60" cy="63" rx="5" ry="3.5" fill="#7a3e20"/>
        <path d="M53 70 Q60 77 67 70" stroke="#7a3e20" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="60" cy="100" rx="28" ry="22" fill="#c8865a"/>
        <ellipse cx="60" cy="100" rx="16" ry="14" fill="#f5dfc9"/>
        <ellipse cx="27" cy="95" rx="12" ry="8" fill="#c8865a" transform="rotate(-30 27 95)"/>
        <ellipse cx="93" cy="95" rx="12" ry="8" fill="#c8865a" transform="rotate(30 93 95)"/>
        <text x="55" y="104" font-size="12" fill="rgba(220,80,120,0.7)">♥</text>
      </svg>
    </div>

    <div class="msg-card">
      <div class="from-label">✦ untukmu ✦</div>
      <div class="typewriter-text" id="typewriter-text">
        <span class="cursor" id="cursor"></span>
      </div>
      <div class="bottom-tag" id="sign-tag">— dengan sepenuh hati 🌙</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const stars = [];
  const shootingStars = [];

  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.6 + 0.2,
      a: Math.random(),
      da: (Math.random() * 0.007 + 0.003) * (Math.random() > 0.5 ? 1 : -1)
    });
  }

  function spawnShootingStar() {
    shootingStars.push({
      x: Math.random() * canvas.width * 0.7,
      y: Math.random() * canvas.height * 0.4,
      len: Math.random() * 100 + 80,
      speed: Math.random() * 6 + 4,
      progress: 0
    });
  }

  setInterval(spawnShootingStar, 2600);
  setTimeout(spawnShootingStar, 400);
  setTimeout(spawnShootingStar, 1200);

  function animStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0.1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 210, 255, ${s.a})`;
      ctx.fill();
    });
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const ss = shootingStars[i];
      ss.progress += ss.speed;
      const angle = -0.5;
      const dx = Math.cos(angle) * ss.progress;
      const dy = Math.sin(angle) * ss.progress;
      const fade = 1 - ss.progress / ss.len;
      if (fade <= 0) { shootingStars.splice(i, 1); continue; }
      const tailX = ss.x + dx - Math.cos(angle) * 100 * (1 - fade);
      const tailY = ss.y + dy - Math.sin(angle) * 100 * (1 - fade);
      const grad = ctx.createLinearGradient(tailX, tailY, ss.x + dx, ss.y + dy);
      grad.addColorStop(0, `rgba(255,255,255,0)`);
      grad.addColorStop(1, `rgba(200,180,255,${fade * 0.95})`);
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(ss.x + dx, ss.y + dy);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ss.x + dx, ss.y + dy, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${fade})`;
      ctx.fill();
    }
    requestAnimationFrame(animStars);
  }
  animStars();

  function enterMain() {
    const landing = document.getElementById('landing');
    landing.style.opacity = '0';
    landing.style.transform = 'scale(0.95)';
    landing.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
    setTimeout(() => {
      landing.style.display = 'none';
      const main = document.getElementById('main-page');
      main.classList.add('visible');
      setTimeout(startTypewriter, 500);
    }, 700);
  }

  const msg = `Kalau hari ini terasa berat, ingat ya… kamu nggak sendiri. Aku selalu ada buat kamu, walaupun cuma lewat kata-kata. Kamu itu kuat, lebih dari yang kamu kira. Jangan nyerah ya, aku bangga sama kamu setiap hari 💗

Capek itu wajar, tapi kamu jangan berhenti ya. Aku di sini selalu dukung kamu, apapun yang kamu lewatin. Kamu hebat, jangan ragu sama diri kamu sendiri 🤍

Mungkin dunia lagi nggak baik-baik aja ke kamu, tapi percayalah… kamu lebih kuat dari semua itu. Setiap langkah kecil kamu tetap berarti. Aku selalu percaya sama kamu, bahkan di saat kamu ragu sama diri sendiri 🌙

Semangat ya cantik, jangan terlalu keras sama diri sendiri. Kalau capek, istirahat… kalau sedih, cerita ke aku. Soalnya kebahagiaan kamu itu penting banget buat aku 💗`;

  let charIndex = 0;

  function startTypewriter() {
    const el = document.getElementById('typewriter-text');
    function type() {
      if (charIndex < msg.length) {
        const ch = msg[charIndex];
        const cursorHTML = '<span class="cursor" id="cursor"></span>';
        const content = el.innerHTML.replace(cursorHTML, '');
        if (ch === '\n') {
          el.innerHTML = content + '<br>' + cursorHTML;
        } else {
          el.innerHTML = content + ch + cursorHTML;
        }
        charIndex++;
        const delay = ch === '.' || ch === '!' || ch === '?' ? 270 :
                      ch === ',' || ch === '…' ? 150 :
                      ch === '\n' ? 400 : 36;
        setTimeout(type, delay);
      } else {
        document.getElementById('sign-tag').style.opacity = '1';
      }
    }
    type();
  }
</script>
</body>
</html>
